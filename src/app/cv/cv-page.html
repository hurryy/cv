<div class="toolbar">
  <a
    #langLink
    class="tool"
    [routerLink]="otherLangPath()"
    queryParamsHandling="preserve"
    [attr.hreflang]="otherLang()"
    [attr.aria-label]="text().otherLanguageLabel"
    >{{ text().otherLanguage }}</a
  >
  <button
    type="button"
    class="tool"
    [attr.aria-label]="text().darkThemeLabel"
    [attr.aria-pressed]="theme.theme() === 'dark'"
    (click)="theme.toggle()"
  >
    <app-icon name="dark_mode" />
  </button>
  <a class="tool" [href]="mailto()" (click)="share($event)">
    <app-icon name="share" />
    <span class="wide-only">{{ text().share }}</span>
  </a>
  <a class="tool primary" [href]="pdf()" [attr.download]="pdfName()">
    <app-icon name="download" />
    <!-- Un seul élément flex : le `gap` de `.tool` ne doit pas séparer les deux mots. -->
    <span
      ><span class="wide-only">{{ text().downloadPdf.verb }}</span>
      {{ text().downloadPdf.object }}</span
    >
  </a>
</div>

<main>
  <app-layout-sobre [lang]="lang()" [format]="format()" />
</main>
