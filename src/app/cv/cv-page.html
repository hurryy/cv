<div class="toolbar">
  <label class="style-picker">
    <span>{{ text().styleLabel }}</span>
    <select #styleSelect class="tool" (change)="selectStyle(styleSelect.value)">
      @for (style of styleOptions; track style) {
        <option [value]="style" [selected]="style === styles.style()">
          {{ text().styleNames[style] }}
        </option>
      }
    </select>
  </label>
  <a
    #langLink
    class="tool"
    [routerLink]="otherLangPath()"
    queryParamsHandling="preserve"
    [attr.hreflang]="otherLang()"
    [attr.aria-label]="text().otherLanguageLabel"
    >{{ text().otherLanguage }}</a
  >
  @if (pdf(); as pdf) {
    <a class="tool" [href]="pdf" download [attr.aria-label]="text().downloadPdfLabel">
      <app-icon name="download" />
      {{ text().downloadPdf }}
    </a>
  }
  <button
    type="button"
    class="tool"
    [attr.aria-label]="text().darkThemeLabel"
    [attr.aria-pressed]="theme.theme() === 'dark'"
    (click)="theme.toggle()"
  >
    <app-icon name="dark_mode" />
  </button>
</div>

<main>
  <app-layout-sobre [lang]="lang()" [format]="format()" />
  <app-layout-commentaires [lang]="lang()" [format]="format()" />
  <app-layout-editeur [lang]="lang()" />
</main>
