<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Yann HURRY — Développeur .NET Full Stack</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CV de Yann HURRY, développeur .NET et Angular, Annecy – Genève.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Pose le thème mémorisé avant le premier rendu, sans quoi la page clignote. Clé : THEME_STORAGE_KEY (src/app/cv/theme.ts). -->
  <script>try{var t=localStorage.getItem('cv-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
  <!-- Idem pour le style (src/app/cv/cv-style.ts : CV_STYLES, STYLE_QUERY_PARAM, STYLE_STORAGE_KEY). Un ?style= présent l'emporte ; inconnu, il laisse le défaut écrit par le prérendu. -->
  <script>try{var q=new URLSearchParams(location.search).get('style'),s=q!==null?q:localStorage.getItem('cv-style');if(s==='sobre'||s==='commentaires'||s==='editeur')document.documentElement.setAttribute('data-style',s)}catch(e){}</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
