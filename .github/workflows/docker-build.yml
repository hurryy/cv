name: "Docker Build & Push"

# - `build` : sur push et PR, construit l'image SANS la pousser.
# - `publish` : seulement sur déclenchement manuel depuis `master`, et seulement
#   si la variable de dépôt `DEPLOY_ENABLED` vaut exactement `true`. Seul job à
#   recevoir `packages: write`. Restreint à `master` pour que tout tag
#   déployable, rollback compris, vienne d'un code mergé.
# Aucun push, merge ou tag ne publie d'image.
on:
  pull_request:
  push:
    branches: [claude, dev, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  IMAGE: ghcr.io/hurryy/cv

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=cv
          cache-to: type=gha,mode=max,scope=cv

  publish:
    if: >-
      github.event_name == 'workflow_dispatch' && vars.DEPLOY_ENABLED == 'true'
      && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Compute tags
        id: tags
        env:
          SHA: ${{ github.sha }}
        run: echo "tags=${IMAGE}:sha-${SHA:0:7},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=cv
          cache-to: type=gha,mode=max,scope=cv
