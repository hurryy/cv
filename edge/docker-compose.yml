# Caddy de bordure du VPS : seul service qui publie des ports. Termine TLS pour
# tous les sites (CV, puis app-shop) et les joint sur le réseau Docker `edge`.
#
# À démarrer AVANT les sites, une seule fois par VPS :
#   docker compose up -d
# Après modification de conf/Caddyfile :
#   docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile

name: edge

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?à définir dans .env}
      CV_DOMAIN: ${CV_DOMAIN:?à définir dans .env}
      PREVIEW_USER: ${PREVIEW_USER:?à définir dans .env}
      PREVIEW_HASH: ${PREVIEW_HASH:?à définir dans .env}
    volumes:
      # Le dossier, pas le fichier : un bind mount de fichier reste attaché à
      # l'inode d'origine, et un Caddyfile réécrit (git pull, scp, éditeur)
      # resterait invisible au reload.
      - ./conf:/etc/caddy:ro
      # Certificats et clés privées : à sauvegarder, ne pas supprimer à la
      # légère (Let's Encrypt limite les émissions).
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    # Exception assumée à « jamais root » : ce conteneur ouvre 80/443 et possède
    # le volume des certificats. Toutes les capacités retirées sauf celle-là.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    # L'API d'administration reste sur 127.0.0.1:2019, non publiée.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:

# Réseau nommé explicitement : les composes des sites le déclarent `external`.
networks:
  edge:
    name: edge
