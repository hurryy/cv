<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Copié en /etc/fonts/local.conf par l'étape `pdf` du Dockerfile. DejaVu, tiré par fontconfig,
  serait sinon la police sans empattement par défaut : system-ui et sans-serif (pile de polices
  de src/styles.scss) passent d'abord par Roboto. Deux tirets de suite sont interdits dans un
  commentaire XML : fontconfig rejetterait tout le fichier.
-->
<fontconfig>
  <alias>
    <family>system-ui</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer><family>Roboto</family></prefer>
  </alias>
</fontconfig>
